# PSY: needrestart (run by unattended-upgrades after package upgrades) must not restart the bot
# or its media services in the middle of the day. psy-restart-outdated.timer restarts the ones
# running outdated code at night, and only while the bot is idle. Installed by ops/install-runtime
# as /etc/needrestart/conf.d/50-psy.conf.
$nrconf{override_rc}{qr(^hermes-gateway\.service$)} = 0;
$nrconf{override_rc}{qr(^psy-)} = 0;
